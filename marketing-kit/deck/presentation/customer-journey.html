</style></head><body><div class="slide-container"><div class="left-col"><div class="eyebrow">05 · أداة البيع المطبوعة</div><div class="title">البروشور يحول الفضول إلى طلب</div><div class="img-wrap"><img src="/home/ubuntu/house_of_spices_audit/marketing-kit/packaging/qr-scan-moment.jpg" alt="عميل يمسح QR على عبوة"></div></div><div class="right-col"><div class="lead">في خمس ثوانٍ يفهم العميل ما عليه فعله، سواء وجد البروشور في المتجر أو المطعم أو داخل الطلب.</div><div class="steps"><div class="step"><div class="num">١</div><div class="step-text"><b>امسح.</b> افتح متجر بيت البهارات.</div></div><div class="step"><div class="num">٢</div><div class="step-text"><b>تصفح.</b> اختر من الكتالوج والعروض.</div></div><div class="step"><div class="num">٣</div><div class="step-text"><b>اطلب.</b> أرسل طلبك من الهاتف.</div></div></div><div class="note">بروشور A5 أمامي وخلفي، جاهز للطباعة والتوزيع مع كل طلب.</div></div></div></body></html>
