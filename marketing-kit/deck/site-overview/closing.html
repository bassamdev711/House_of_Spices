<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع واحد… رحلة شراء كاملة</title>
<style>
:root { --olive: #31401F; --ivory: #F7F3EA; --gold: #B69A56; --dark: #20271A; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--olive); }
.slide-container { width: 1280px; min-height: 720px; background: var(--olive); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.content { text-align: center; z-index: 2; max-width: 900px; }
.mark { font-size: 22px; letter-spacing: 2px; color: var(--gold); font-weight: 700; margin-bottom: 32px; display: inline-block; border-bottom: 2px solid var(--gold); padding-bottom: 8px; }
.title { font-size: 64px; line-height: 1.15; font-weight: 700; color: var(--ivory); margin-bottom: 24px; }
.subtitle { font-size: 28px; line-height: 1.6; color: var(--ivory); opacity: 0.9; margin-bottom: 64px; }
.cta { font-size: 22px; color: var(--gold); margin-bottom: 16px; }
.url { font-size: 28px; color: var(--olive); font-family: monospace; font-weight: bold; background: var(--gold); padding: 16px 32px; border-radius: 8px; display: inline-block; text-decoration: none; }
.note { position: absolute; bottom: 30px; font-size: 15px; color: var(--ivory); opacity: 0.5; text-align: center; width: 100%; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="content">
    <div class="mark">بيت البهارات</div>
    <div class="title">موقع واحد… رحلة شراء كاملة</div>
    <div class="subtitle">يجمع الهوية، الاكتشاف، تفاصيل المنتج، السلة، المفضلة، والتتبع في تجربة عربية واضحة وسلسة.</div>
    <div class="cta">افتح الموقع الآن وتصفح التجربة الحية</div>
    <div class="url">https://house-of-spices-linl.vercel.app/</div>
  </div>
  <div class="note">جميع لقطات الشاشة في هذا العرض مأخوذة من الموقع الحي في 17 أغسطس 2026.</div>
</div>
</body>
</html>
