<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيت البهارات — جولة داخل الموقع</title>
<style>
:root { --olive: #31401F; --ivory: #F7F3EA; --gold: #B69A56; --dark: #20271A; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--ivory); }
.slide-container { width: 1280px; min-height: 720px; background: var(--ivory); display: flex; position: relative; overflow: hidden; }
.copy { width: 50%; padding: 140px 80px 0 60px; z-index: 2; }
.mark { font-size: 20px; letter-spacing: 2px; color: var(--gold); font-weight: 700; margin-bottom: 24px; display: inline-block; border-bottom: 2px solid var(--gold); padding-bottom: 8px; }
.title { font-size: 64px; line-height: 1.15; font-weight: 700; color: var(--olive); margin-bottom: 32px; }
.subtitle { font-size: 26px; line-height: 1.6; color: var(--dark); opacity: 0.8; margin-bottom: 64px; }
.url { font-size: 22px; color: var(--olive); font-family: monospace; font-weight: bold; background: rgba(182, 154, 86, 0.15); padding: 12px 24px; border-radius: 8px; display: inline-block; border: 1px solid var(--gold); }
.visual { width: 50%; padding: 80px 0 0 80px; position: relative; }
.browser-frame { width: 100%; height: 640px; background: #fff; border-radius: 12px 12px 0 0; box-shadow: -10px 20px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(49, 64, 31, 0.2); }
.browser-bar { height: 32px; background: #E5E5E5; display: flex; align-items: center; padding: 0 16px; gap: 8px; direction: ltr; border-bottom: 1px solid #D5D5D5; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.r { background: #FF5F56; } .dot.y { background: #FFBD2E; } .dot.g { background: #27C93F; }
.browser-content { flex: 1; overflow: hidden; position: relative; }
.browser-content img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="copy">
    <div class="mark">عرض تطبيقي</div>
    <div class="title">بيت البهارات<br>جولة داخل الموقع</div>
    <div class="subtitle">عرض بصري يشرح صفحات وتجربة متجر House of Spices من أول زيارة إلى متابعة الطلب.</div>
    <div class="url">https://house-of-spices-linl.vercel.app/</div>
  </div>
  <div class="visual">
    <div class="browser-frame">
      <div class="browser-bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      </div>
      <div class="browser-content">
        <img src="/home/ubuntu/house_of_spices_audit/marketing-kit/deck/site-overview/assets/home.webp" alt="الصفحة الرئيسية للموقع">
      </div>
    </div>
  </div>
</div>
</body>
</html>
